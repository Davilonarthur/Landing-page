<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./Styles.css">
</head>
<body>
    <div id="DivLogin">
        <h2>Login</h2>
        <form id="Formslogin" action="">
            <input type="email" name="E-mail" placeholder="Seu E-mail" required>
            <input type="password" name="senha" placeholder="Insira Sua senha" required>
            <button name="ButtonLogin">Login</button>
            <p id="ParagrafoLogin">Ainda não tem Cadastro?
                <a href="#cadastro">Cadastre-se agora.</a>
            </p>
        </form>
    </div>
    <Div id="DivCadastro">
        <form action="Formslogin">
            <input type=" text" name="Nome" placeholder="Insira seu nome." required>
            <input type="email" name="E-mailCadastro" placeholder="Insira seu E-mail" required>
            <input type="password" name="Senha" placeholder="Crie sua senha" required>
            <button name="ButtonCadastro">Cadastrar</button>
            <p>Já tem cadastro?
                <a href="#Login"> Acesse sua conta!</a>
            </p>
        </form>
    </Div>
    
</body>
</html>
